plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'tw.onceover'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "tw.onceover.photoactions"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // IntentSenderRequest／StartIntentSenderForResult（系統垃圾桶確認視窗）。版本對齊 expo-media-library。
  implementation 'androidx.activity:activity-ktx:1.11.0'
  implementation "androidx.annotation:annotation:1.9.1"
}
